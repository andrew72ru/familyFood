---
- name: Install dependencies for repository management
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

# NodeSource for Ubuntu 24.04 LTS (noble) requires the setup script approach
- name: Run NodeSource setup script
  shell: |
    set -o pipefail
    curl -fsSL https://deb.nodesource.com/setup_{{ node_version }} | bash -
  args:
    executable: /bin/bash
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_release == 'noble'

# Legacy manual repo setup for older (or newer non-LTS) Ubuntu versions
- name: Create keyrings directory
  file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'
  when: not (ansible_distribution == 'Ubuntu' and ansible_distribution_release == 'noble')

- name: Download NodeSource GPG key
  shell: "curl -fsSL https://deb.nodesource.com/gpgkey/nodesource.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg"
  args:
    creates: /usr/share/keyrings/nodesource.gpg
  when: not (ansible_distribution == 'Ubuntu' and ansible_distribution_release == 'noble')

- name: Set distribution release for Node.js
  set_fact:
    node_dist_release: "{{ 'noble' if ansible_distribution == 'Ubuntu' and ansible_distribution_release == 'plucky' else ansible_distribution_release }}"
  when: not (ansible_distribution == 'Ubuntu' and ansible_distribution_release == 'noble')

- name: Add or remove NodeSource repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_version }} {{ node_dist_release }} main"
    state: "{{ 'absent' if ansible_distribution_release == 'plucky' else 'present' }}"
    filename: nodesource
  when: not (ansible_distribution == 'Ubuntu' and ansible_distribution_release == 'noble')
- name: Install Node.js
  apt:
    name: nodejs
    state: latest
    update_cache: yes

- name: Install npm (Ubuntu plucky only)
  apt:
    name: npm
    state: latest
    update_cache: yes
  when: ansible_distribution_release == 'plucky'

- name: Update npm
  npm:
    name: npm
    global: yes
    state: latest
  ignore_errors: yes
  when: not ansible_check_mode
